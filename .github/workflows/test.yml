name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/translate-core.js
